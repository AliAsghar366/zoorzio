apiVersion: v1
kind: Namespace
metadata:
  name: anchor
  labels:
    name: anchor
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: anchor-quota
  namespace: anchor
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: anchor-limit-range
  namespace: anchor
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
---
apiVersion: v1
kind: Secret
metadata:
  name: anchor-secrets
  namespace: anchor
type: Opaque
stringData:
  database-url: "postgresql://postgres:postgres@postgres:5432/anchor"
  redis-url: "redis://redis:6379"
  jwt-secret: "your-jwt-secret"
  jwt-refresh-secret: "your-refresh-secret"
  encryption-key: "your-encryption-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anchor-config
  namespace: anchor
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://anchor.app"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anchor-network-policy
  namespace: anchor
spec:
  podSelector:
    matchLabels:
      app: anchor-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: anchor
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
