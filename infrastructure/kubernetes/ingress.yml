apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anchor-ingress
  namespace: anchor
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - anchor.app
    - api.anchor.app
    secretName: anchor-tls
  rules:
  - host: anchor.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: anchor-web
            port:
              number: 80
  - host: api.anchor.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: anchor-api
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: anchor-api
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: anchor-api
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: anchor-web
  namespace: anchor
spec:
  selector:
    app: anchor-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anchor-web
  namespace: anchor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anchor-web
  template:
    metadata:
      labels:
        app: anchor-web
    spec:
      containers:
      - name: web
        image: anchor/web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://anchor-api:80/api"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
