version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anchor-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anchor_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: anchor-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server (Development)
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile.dev
    container_name: anchor-api-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/anchor_dev
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/api/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev:api

  # AI Services (Development)
  ai:
    build:
      context: ../../
      dockerfile: apps/ai/Dockerfile.dev
    container_name: anchor-ai-dev
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/anchor_dev
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/ai:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Web Dashboard (Development)
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile.dev
    container_name: anchor-web-dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
    command: npm run dev:web

volumes:
  postgres_dev_data:
  redis_dev_data:
