changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🔒 Security
      labels:
        - security
    - title: ⚡ Performance
      labels:
        - performance
    - title: ♻️ Refactoring
      labels:
        - refactor
    - title: 🧪 Tests
      labels:
        - test
        - tests
    - title: 🔧 Maintenance
      labels:
        - chore
        - maintenance
    - title: 📦 Dependencies
      labels:
        - dependencies
